name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ created ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev imagemagick fuse libfuse2

      - name: Build
        run: make

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/icons/hicolor/256x256/apps

          cp photon AppDir/usr/bin/photon
          cp installer/linux/photon.desktop AppDir/
          cp installer/linux/AppRun AppDir/
          chmod +x AppDir/AppRun AppDir/usr/bin/photon

          # Bundle SDL2 libs
          cp /usr/lib/x86_64-linux-gnu/libSDL2-2.0.so.0 AppDir/usr/lib/
          cp /usr/lib/x86_64-linux-gnu/libSDL2_image-2.0.so.0 AppDir/usr/lib/

          # Generate icon using ImageMagick
          convert -size 256x256 xc:#1a1a2e \
            -fill white -font DejaVu-Sans-Bold -pointsize 100 \
            -gravity center -annotate 0 "P" \
            AppDir/photon.png

          cp AppDir/photon.png AppDir/usr/share/icons/hicolor/256x256/apps/photon.png

          # Download and run appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Photon-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Linux
          path: Photon-x86_64.AppImage

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Photon-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            make

      - name: Build
        run: |
          make
          cp /mingw64/bin/SDL2.dll .
          cp /mingw64/bin/SDL2_image.dll .

      - name: Build NSIS installer
        shell: pwsh
        run: |
          choco install nsis -y
          Set-Location $env:GITHUB_WORKSPACE
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DWORKDIR="$env:GITHUB_WORKSPACE" installer\windows\photon.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Windows
          path: Photon-Setup.exe

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Photon-Setup.exe
