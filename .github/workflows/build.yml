name: Build

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev wget

      - name: Build
        run: make

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps

          cp photon AppDir/usr/bin/photon

          # Bundle SDL2 libraries
          for lib in \
            libSDL2-2.0.so.0 \
            libSDL2_image-2.0.so.0 \
            libSDL2_ttf-2.0.so.0; do
            src=$(find /usr/lib -name "$lib" 2>/dev/null | head -1)
            [ -n "$src" ] && cp "$src" AppDir/usr/lib/
          done

          cat > AppDir/usr/share/applications/photon.desktop << 'DESKTOPEOF'
          [Desktop Entry]
          Name=Photon
          Comment=Lightweight image viewer
          Exec=photon %f
          Icon=photon
          Type=Application
          Categories=Graphics;Viewer;
          MimeType=image/png;image/jpeg;image/bmp;image/gif;image/x-tga;image/webp;
          DESKTOPEOF

          touch AppDir/usr/share/icons/hicolor/256x256/apps/photon.png
          cp AppDir/usr/share/applications/photon.desktop AppDir/photon.desktop
          cp AppDir/usr/share/icons/hicolor/256x256/apps/photon.png AppDir/photon.png

          cat > AppDir/AppRun << 'APPRUNEOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/photon" "$@"
          APPRUNEOF
          chmod +x AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
               -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Photon-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Linux-AppImage
          path: Photon-x86_64.AppImage

  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_ttf
            make

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build
        run: make

      - name: Bundle DLLs
        run: |
          mkdir -p release
          cp photon.exe release/

          # Auto-detect every DLL photon.exe needs and copy from /mingw64/bin
          ldd photon.exe \
            | grep -i '/mingw64/' \
            | awk '{print $3}' \
            | xargs -I{} cp {} release/

      - name: Build installer
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          $workdir = (Get-Location).Path -replace '\\','/'
          & "makensis.exe" /DWORKDIR="$workdir\release" installer\windows\photon.nsi

      - name: Zip portable release
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath Photon-Windows.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Windows
          path: |
            Photon-Windows.zip
            Photon-Setup.exe

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Photon ${{ github.ref_name }}
          body: |
            ## Photon Image Viewer ${{ github.ref_name }}

            ### Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows (Installer) | `Photon-Setup.exe` | Installs to Program Files, adds file associations |
            | Windows (Portable)  | `Photon-Windows.zip` | Extract and run `photon.exe` — no install needed |
            | Linux               | `Photon-x86_64.AppImage` | `chmod +x` then run |

            ### Controls
            | Key | Action |
            |-----|--------|
            | `O` | Open file dialog |
            | `←` / `→` | Previous / next image |
            | `R` / `Shift+R` | Rotate clockwise / counter-clockwise |
            | `I` | Toggle info panel |
            | `T` | Toggle thumbnail strip |
            | `Ctrl+C` | Copy image to clipboard |
            | `Del` | Delete image (with confirmation) |
            | `F` | Fit to window |
            | `1` | Actual size |
            | Mouse drag | Pan image |
            | Scroll wheel | Zoom |
            | Drag & drop | Open dropped image file |

          files: |
            Photon-Linux-AppImage/Photon-x86_64.AppImage
            Photon-Windows/Photon-Windows.zip
            Photon-Windows/Photon-Setup.exe
