name: Build

on:
  push:
    branches: [ "main" ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev fonts-dejavu-core wget

      - name: Build
        run: make

      - name: Run motion, UI and interaction tests
        run: make test

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps

          cp photon AppDir/usr/bin/photon

          ldd photon | awk '
            /=> \// { print $3 }
            /^\//    { print $1 }
          ' | sort -u | while read -r lib; do
            base="$(basename "$lib")"
            case "$base" in
              libc.so.*|libm.so.*|libpthread.so.*|librt.so.*|libdl.so.*|ld-linux*.so.*)
                continue
                ;;
            esac
            cp -L "$lib" AppDir/usr/lib/
          done

          install -m 0644 installer/linux/photon.desktop \
            AppDir/usr/share/applications/photon.desktop
          install -m 0644 installer/photon.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/photon.png
          cp AppDir/usr/share/applications/photon.desktop AppDir/photon.desktop
          cp AppDir/usr/share/icons/hicolor/256x256/apps/photon.png AppDir/photon.png

          install -m 0755 installer/linux/AppRun AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
               -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Photon-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Linux-AppImage
          path: Photon-x86_64.AppImage

  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_ttf
            make

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build
        run: make

      - name: Bundle DLLs
        run: |
          mkdir -p release
          cp photon.exe release/

          # Auto-detect every DLL photon.exe needs and copy from /mingw64/bin
          ldd photon.exe \
            | grep -i '/mingw64/' \
            | awk '{print $3}' \
            | xargs -I{} cp {} release/

      - name: Build installer
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          $workdir = (Get-Location).Path -replace '\\','/'
          & "makensis.exe" /DWORKDIR="$workdir\release" installer\windows\photon.nsi

      - name: Zip portable release
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath Photon-Windows.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Windows
          path: |
            Photon-Windows.zip
            Photon-Setup.exe


  # ── Android ──────────────────────────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Fetch SDL dependencies
        working-directory: Android/app/jni
        run: |
          git clone --depth 1 --branch release-2.32.10 \
            https://github.com/libsdl-org/SDL.git SDL

          git clone --depth 1 --branch release-2.8.12 \
            https://github.com/libsdl-org/SDL_image.git SDL_image

          git clone --depth 1 --branch release-2.24.0 \
            https://github.com/libsdl-org/SDL_ttf.git SDL_ttf

          cd SDL_ttf
          git submodule update --init --recursive

      - name: Build Android APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare APK
        working-directory: Android
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            ../Photon-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Android
          path: Photon-Android.apk

  # ── GitHub Release ───────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-android
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Photon ${{ env.RELEASE_TAG }}
          body: |
            ## Photon Image Viewer ${{ env.RELEASE_TAG }}

            ### Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | Android             | `Photon-Android.apk` | Install directly on Android |
            | Windows (Installer) | `Photon-Setup.exe` | Installs to Program Files, adds Photon to Open With |
            | Windows (Portable)  | `Photon-Windows.zip` | Extract and run `photon.exe` — no install needed |
            | Linux               | `Photon-x86_64.AppImage` | `chmod +x` then run |

            ### Controls
            | Key | Action |
            |-----|--------|
            | `O` | Open file dialog |
            | `←` / `→` | Previous / next image |
            | `R` / `Shift+R` | Rotate clockwise / counter-clockwise |
            | `I` | Toggle info panel |
            | `T` | Toggle thumbnail strip |
            | `Ctrl+C` | Copy image on Windows, file path on Linux/macOS |
            | `Del` | Delete image (with confirmation) |
            | `F` | Fit to window |
            | `1` | Actual size |
            | Mouse drag | Pan image |
            | Scroll wheel | Zoom |
            | Drag & drop | Open dropped image file |

          files: |
            Photon-Android/Photon-Android.apk
            Photon-Linux-AppImage/Photon-x86_64.AppImage
            Photon-Windows/Photon-Windows.zip
            Photon-Windows/Photon-Setup.exe
