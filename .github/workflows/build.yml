name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev wget

      - name: Build
        run: make

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp photon AppDir/usr/bin/photon
          cp /usr/lib/x86_64-linux-gnu/libSDL2-2.0.so.0 AppDir/usr/lib/
          cp /usr/lib/x86_64-linux-gnu/libSDL2_image-2.0.so.0 AppDir/usr/lib/

          cat > AppDir/usr/share/applications/photon.desktop << EOF
          [Desktop Entry]
          Name=Photon
          Exec=photon
          Icon=photon
          Type=Application
          Categories=Graphics;Viewer;
          EOF

          touch AppDir/usr/share/icons/hicolor/256x256/apps/photon.png
          cp AppDir/usr/share/applications/photon.desktop AppDir/photon.desktop
          cp AppDir/usr/share/icons/hicolor/256x256/apps/photon.png AppDir/photon.png

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/photon" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Photon-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Linux-AppImage
          path: Photon-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            make

      - name: Build
        run: |
          make
          mkdir -p release
          cp photon.exe release/
          cp /mingw64/bin/SDL2.dll release/
          cp /mingw64/bin/SDL2_image.dll release/
          cp /mingw64/bin/libgcc_s_seh-1.dll release/ 2>/dev/null || true
          cp /mingw64/bin/libwinpthread-1.dll release/ 2>/dev/null || true
          cp /mingw64/bin/libstdc++-6.dll release/ 2>/dev/null || true

      - name: Zip release folder
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath Photon-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photon-Windows
          path: Photon-Windows.zip

  release:
    name: Create GitHub Release
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Photon ${{ github.ref_name }}
          body: |
            ## Photon Image Viewer ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows  | `Photon-Windows.zip` — extract and run `photon.exe` |
            | Linux    | `Photon-x86_64.AppImage` — `chmod +x` then run |

            ### What's new
            See [commits](${{ github.server_url }}/${{ github.repository }}/commits/${{ github.ref_name }}) for changes.
          files: |
            Photon-Linux-AppImage/Photon-x86_64.AppImage
            Photon-Windows/Photon-Windows.zip
